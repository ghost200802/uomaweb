    uint64 current_page = 1;
    uint64 page_size = 2;
    uint64 total_count = 3;
    uint64 total_pages = 4;
    repeated UserVirtualCurrencyChange user_virtual_currency_changes = 5;
  }

  uint32 code = 1;
  ResponseData data = 2;
}

message CreateShortUrlRequest {
  string long_url = 1 [(validate.rules).string = {min_len: 1}];
}

message CreateShortUrlResponse {
  message ResponseData {
    string short_url = 1;
  }

  uint32 code = 1;
  ResponseData data = 2;
}